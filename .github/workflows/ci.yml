name: CI
# Once per pull request (it tests the branch merged with main), not again for the branch push, to save Actions
# minutes. A newer push to the same PR cancels the run it replaces. Run it by hand from Actions -> CI -> Run workflow.
on:
  pull_request:
  workflow_dispatch:

# Read the code only: nothing in CI needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r server/requirements-dev.txt
      - run: cd server && python -m pytest -q
      - name: Known security problems in the server's libraries
        run: pip-audit -r server/requirements.txt  # pip-audit itself is pinned in requirements-dev.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: cd web && npm ci && npm run build
      - name: Known security problems in the web libraries
        run: cd web && npm audit --audit-level=high --omit=dev
